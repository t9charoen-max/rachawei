name: Sync next-deploy branch

on:
  push:
    branches:
      - main
    paths:
      - next-app/**
      - .github/workflows/sync-next-deploy.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-next-deploy
  cancel-in-progress: true

jobs:
  sync:
    name: Publish next-app to next-deploy branch
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build deploy tree (next-app only, no duplicate nest)
        run: |
          rm -rf /tmp/next-deploy
          mkdir -p /tmp/next-deploy
          # ไม่ copy .github — GITHUB_TOKEN ไม่มีสิทธิ์ push workflow ไป branch อื่น
          # วางที่ root ของ branch เท่านั้น (ห้ามซ้ำทั้ง root และ next-app/)
          rsync -a --exclude='.github' --exclude='.next' --exclude='out' --exclude='node_modules' next-app/ /tmp/next-deploy/
          cat > /tmp/next-deploy/DEPLOY_BRANCH.txt <<'EOF'
          Branch สำหรับ Vercel deploy ราชาวัสดุ (แยกจากราชาหวาย)
          - Vercel project: rachawei-f1it (หรือชื่ออื่น)
          - Root Directory: ./
          - Production Branch: next-deploy
          - ไม่ใช้ basePath — แอปอยู่ที่ root ของโดเมนแยก
          Live: https://rachawei-f1it.vercel.app/
          EOF

      - name: Push to next-deploy branch
        run: |
          cd /tmp/next-deploy
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "deploy: sync next-app from ${GITHUB_SHA::7}"
          git branch -M next-deploy
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" next-deploy
