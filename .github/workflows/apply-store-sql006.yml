name: Apply store SQL 006
on:
  workflow_dispatch:
  push:
    paths:
      - 'supabase/store/006_admin_auth_grants_bootstrap.sql'
      - 'supabase/store/011_admin_security_search.sql'
      - 'scripts/apply-store-sql006.mjs'
      - '.github/workflows/apply-store-sql006.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Detect credentials
        id: creds
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DB: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -n "$TOKEN" ] || [ -n "$DB" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Credentials present — will apply migrations"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "No SUPABASE_ACCESS_TOKEN / DATABASE_URL — skip apply (not a hard failure)"
          fi

      - name: Apply 006 + 011
        if: steps.creds.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_PROJECT_REF: jvgfudxdwdwfumdznymu
          VITE_SUPABASE_URL: https://jvgfudxdwdwfumdznymu.supabase.co
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          CLOSEOUT_API_BASE: https://rachawei-gamma.vercel.app
        run: node scripts/apply-store-sql006.mjs

      - name: Probe Production RPC status (no secrets required)
        if: steps.creds.outputs.ready != 'true'
        env:
          CLOSEOUT_API_BASE: https://rachawei-gamma.vercel.app
        run: node scripts/apply-store-sql006.mjs --status || true
