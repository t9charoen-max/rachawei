# Deploy Supabase Edge Function: ai-sales-assistant
# Trigger from GitHub mobile / Safari: Actions → Deploy AI sales assistant → Run workflow
# Requires repo secret SUPABASE_ACCESS_TOKEN (Personal Access Token from supabase.com/dashboard/account/tokens)
# Does NOT use or print GEMINI_API_KEY (that secret stays in Supabase Edge Function Secrets)
name: Deploy AI sales assistant

on:
  workflow_dispatch:
    inputs:
      confirm_project_ref:
        description: 'Must equal jvgfudxdwdwfumdznymu (from Production store-config)'
        required: true
        default: 'jvgfudxdwdwfumdznymu'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Guard project ref
        run: |
          EXPECTED='jvgfudxdwdwfumdznymu'
          GOT='${{ inputs.confirm_project_ref }}'
          if [ "$GOT" != "$EXPECTED" ]; then
            echo "Refused: confirm_project_ref must be exactly $EXPECTED (got: $GOT)"
            echo "Tip: do not use a mistyped ref such as jvgfudxdwdwfumdzmnyu"
            exit 1
          fi

      - name: Require SUPABASE_ACCESS_TOKEN
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "Missing GitHub Actions secret SUPABASE_ACCESS_TOKEN"
            echo "Create at https://supabase.com/dashboard/account/tokens"
            echo "Then add as repository secret (Settings → Secrets and variables → Actions)"
            echo "Do not put GEMINI_API_KEY in GitHub — keep it only in Supabase Edge Function Secrets"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy ai-sales-assistant
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy ai-sales-assistant \
            --project-ref jvgfudxdwdwfumdznymu \
            --no-verify-jwt

      - name: Verify endpoint (no secrets printed)
        env:
          ANON: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -e
          URL='https://jvgfudxdwdwfumdznymu.supabase.co/functions/v1/ai-sales-assistant'
          CODE=$(curl -sS -o /tmp/ai-get.json -w '%{http_code}' "$URL" || true)
          echo "GET HTTP $CODE"
          head -c 300 /tmp/ai-get.json || true
          echo
          if [ "$CODE" != "200" ]; then
            echo "Deploy finished but GET is not 200 yet — open Supabase Dashboard → Edge Functions"
            exit 1
          fi
          if ! grep -q '"ok":true\|"ok": true' /tmp/ai-get.json; then
            echo "Unexpected GET body"
            exit 1
          fi
          if grep -q 'geminiKeyConfigured.:true\|"geminiKeyConfigured": true' /tmp/ai-get.json; then
            echo "PASS geminiKeyConfigured=true (key value not shown)"
          else
            echo "WARN geminiKeyConfigured is not true — check Supabase Edge Function Secret GEMINI_API_KEY on this project"
          fi
          if [ -n "$ANON" ]; then
            PCODE=$(curl -sS -o /tmp/ai-post.json -w '%{http_code}' -X POST "$URL" \
              -H "Authorization: Bearer $ANON" \
              -H "apikey: $ANON" \
              -H "Content-Type: application/json" \
              -d '{"message":"แนะนำตะกร้าไม่เกิน 400 บาท"}' || true)
            echo "POST HTTP $PCODE"
            # show mode only
            node -e "const j=require('/tmp/ai-post.json'); console.log('mode=', j.mode, 'ok=', j.ok, 'products=', Array.isArray(j.products)?j.products.length:0)"
          else
            echo "SKIP POST (optional repo secret VITE_SUPABASE_ANON_KEY not set)"
          fi
