<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>พรีวิวโลโก้ ราชาหวาย</title>
  <style>
    :root { --navy:#0f172a; --gold:#d4a853; --cream:#f6efe6; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Sarabun", "Noto Sans Thai", system-ui, sans-serif;
      background: linear-gradient(160deg, #1a2336 0%, #0b1220 55%, #172033 100%);
      color: #f4efe6;
      min-height: 100vh;
      padding: 28px;
    }
    h1 { margin: 0 0 8px; font-size: 1.5rem; color: var(--gold); }
    p { margin: 0 0 22px; opacity: .85; }
    .grid { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
    .card {
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(212,168,83,.28);
      border-radius: 18px;
      padding: 18px;
    }
    .card h2 { margin: 0 0 12px; font-size: 1rem; color: #f0d9a0; font-weight: 600; }
    .logo-lg {
      width: 100%;
      max-width: 420px;
      border-radius: 14px;
      background: var(--navy);
      display: block;
    }
    .row { display: flex; align-items: center; gap: 12px; }
    .mark {
      width: 56px; height: 56px; border-radius: 12px;
      background: var(--navy); object-fit: contain;
      box-shadow: 0 0 0 1px rgba(212,168,83,.45), 0 10px 20px rgba(0,0,0,.35);
    }
    .name { font-size: 1.25rem; font-weight: 700; color: #f0d39a; line-height: 1.2; }
    .sub { font-size: .85rem; opacity: .75; }
    .icons { display: flex; gap: 14px; align-items: end; flex-wrap: wrap; }
    .icons figure { margin: 0; text-align: center; }
    .icons img { border-radius: 16px; background: var(--navy); display: block; }
    .icons figcaption { margin-top: 6px; font-size: .75rem; opacity: .7; }
    .header-demo {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; padding: 12px 14px; border-radius: 14px;
      background: linear-gradient(180deg, #2a211c, #1a1512);
      border: 1px solid rgba(212,168,83,.25);
    }
    .store-demo {
      background: var(--cream); color: #3b2a22; padding: 14px;
      border-radius: 14px;
    }
    .store-demo .name { color: #5c4033; }
  </style>
</head>
<body>
  <h1>พรีวิวโลโก้ PNG — ราชาหวาย</h1>
  <p>ใช้ไฟล์ทางการทั้งในแอป หน้าร้าน และไอคอนแอป</p>
  <div class="grid">
    <section class="card">
      <h2>โลโก้หลัก</h2>
      <img class="logo-lg" src="/brand/rachawei-logo.png" alt="ราชาหวาย" />
    </section>
    <section class="card">
      <h2>เฮดเดอร์แอป (ตัวอย่าง)</h2>
      <div class="header-demo">
        <div class="row">
          <img class="mark" src="/brand/rachawei-logo.png" alt="" />
          <div>
            <div class="name">ราชาหวาย สุรินทร์</div>
            <div class="sub">งานหัตถกรรมหวาย · สุรินทร์</div>
          </div>
        </div>
      </div>
      <h2 style="margin-top:18px">เฮดเดอร์ร้าน (ตัวอย่าง)</h2>
      <div class="store-demo">
        <div class="row">
          <img class="mark" src="/brand/rachawei-logo.png" alt="" />
          <div>
            <div class="name">ราชาหวายสุรินทร์</div>
            <div class="sub">งานหัตถกรรมหวาย · บ้านบุทม</div>
          </div>
        </div>
      </div>
    </section>
    <section class="card">
      <h2>ไอคอนแอป</h2>
      <div class="icons">
        <figure>
          <img src="/icons/icon-192.png" width="96" height="96" alt="" />
          <figcaption>192</figcaption>
        </figure>
        <figure>
          <img src="/icons/icon-512.png" width="128" height="128" alt="" />
          <figcaption>512</figcaption>
        </figure>
        <figure>
          <img src="/brand/rachawei-logo-square.png" width="128" height="128" alt="" />
          <figcaption>square</figcaption>
        </figure>
      </div>
    </section>
  </div>
</body>
</html>
