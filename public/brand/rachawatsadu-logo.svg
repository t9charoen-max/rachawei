<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="ราชาวัสดุ">
  <defs>
    <linearGradient id="navy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#12233a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a67c1a"/>
      <stop offset="40%" stop-color="#f0d78c"/>
      <stop offset="70%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8a6a14"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="120" height="120" rx="26" fill="url(#navy)"/>
  <rect x="4" y="4" width="112" height="112" rx="22" fill="none" stroke="url(#gold)" stroke-width="2.5"/>
  <!-- crown -->
  <path filter="url(#glow)" fill="url(#gold)" d="M30 52 L42 36 L52 48 L60 28 L68 48 L78 36 L90 52 L86 74 H34 Z"/>
  <rect x="34" y="74" width="52" height="8" rx="2" fill="url(#gold)"/>
  <circle cx="42" cy="36" r="3.2" fill="#ffe4a3"/>
  <circle cx="60" cy="28" r="3.6" fill="#ffe4a3"/>
  <circle cx="78" cy="36" r="3.2" fill="#ffe4a3"/>
  <text x="60" y="100" text-anchor="middle" fill="#f0d78c" font-size="11" font-family="serif" font-weight="700">ราชา</text>
</svg>
