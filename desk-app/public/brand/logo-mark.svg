<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="frameOuter" x1="40" y1="20" x2="470" y2="490" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fff6c4"/>
      <stop offset="18%" stop-color="#f3d56a"/>
      <stop offset="45%" stop-color="#d4af37"/>
      <stop offset="70%" stop-color="#9a7818"/>
      <stop offset="100%" stop-color="#5c470d"/>
    </linearGradient>
    <linearGradient id="frameMid" x1="70" y1="60" x2="440" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8a6c14"/>
      <stop offset="35%" stop-color="#c9a227"/>
      <stop offset="100%" stop-color="#f6db7a"/>
    </linearGradient>
    <linearGradient id="face" x1="110" y1="90" x2="410" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#214572"/>
      <stop offset="30%" stop-color="#123155"/>
      <stop offset="65%" stop-color="#0a1c36"/>
      <stop offset="100%" stop-color="#030914"/>
    </linearGradient>
    <linearGradient id="metalR" x1="145" y1="130" x2="330" y2="370" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fff8d0"/>
      <stop offset="25%" stop-color="#f4d56a"/>
      <stop offset="55%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#7d6212"/>
    </linearGradient>
    <linearGradient id="metalRSide" x1="168" y1="160" x2="210" y2="350" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fff3b0" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#6f5610" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="orb" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(358 156) rotate(90) scale(40)">
      <stop offset="0%" stop-color="#fffbe8"/>
      <stop offset="28%" stop-color="#ffe98a"/>
      <stop offset="62%" stop-color="#e2bc3a"/>
      <stop offset="100%" stop-color="#8a6a12"/>
    </radialGradient>
    <radialGradient id="orbGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(358 156) rotate(90) scale(78)">
      <stop offset="0%" stop-color="#ffe27a" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#d4af37" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="horizon" x1="120" y1="388" x2="392" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3aa0ff" stop-opacity="0"/>
      <stop offset="40%" stop-color="#7fd0ff" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#b7e5ff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#3aa0ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glassShine" x1="100" y1="100" x2="360" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="softShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="rShadow" x="-35%" y="-35%" width="170%" height="170%">
      <feDropShadow dx="5" dy="12" stdDeviation="9" flood-color="#000814" flood-opacity="0.7"/>
    </filter>
    <filter id="orbBloom" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="innerGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="faceClip">
      <rect x="86" y="86" width="340" height="340" rx="74"/>
    </clipPath>
  </defs>

  <!-- Outer metallic gold frame -->
  <rect x="22" y="22" width="468" height="468" rx="112" fill="url(#frameOuter)" filter="url(#softShadow)"/>
  <rect x="46" y="46" width="420" height="420" rx="100" fill="url(#frameMid)"/>
  <!-- Frame bevel lights -->
  <path d="M78 128C96 78 142 50 196 46h128c52 3 98 30 116 76" stroke="#fff8d4" stroke-opacity="0.65" stroke-width="9" stroke-linecap="round"/>
  <path d="M434 198c10 40 8 96-4 142-16 62-58 112-120 132" stroke="#4e3c0c" stroke-opacity="0.5" stroke-width="9" stroke-linecap="round"/>
  <rect x="62" y="62" width="388" height="388" rx="90" fill="none" stroke="#fff1b0" stroke-opacity="0.18" stroke-width="3"/>

  <!-- Recessed glossy face -->
  <rect x="86" y="86" width="340" height="340" rx="74" fill="url(#face)"/>
  <rect x="86" y="86" width="340" height="340" rx="74" fill="none" stroke="#000814" stroke-opacity="0.45" stroke-width="6"/>
  <g clip-path="url(#faceClip)">
    <!-- Atmosphere / earth rim -->
    <ellipse cx="256" cy="438" rx="220" ry="86" fill="#0a2748" opacity="0.9"/>
    <path d="M100 396c44 30 100 48 156 48s112-18 156-48" stroke="url(#horizon)" stroke-width="12" stroke-linecap="round"/>
    <path d="M122 408c38 20 88 30 134 30s96-10 134-30" stroke="#d4af37" stroke-opacity="0.4" stroke-width="5"/>
    <!-- Map / city lights -->
    <g fill="#f0d06a" opacity="0.6">
      <circle cx="164" cy="396" r="2.4"/>
      <circle cx="188" cy="408" r="1.7"/>
      <circle cx="214" cy="400" r="2.1"/>
      <circle cx="246" cy="414" r="1.9"/>
      <circle cx="278" cy="404" r="2.3"/>
      <circle cx="312" cy="412" r="1.6"/>
      <circle cx="340" cy="398" r="2"/>
      <circle cx="366" cy="408" r="1.5"/>
      <circle cx="200" cy="388" r="1.4"/>
      <circle cx="290" cy="390" r="1.5"/>
    </g>
    <!-- Glass dome sheen -->
    <path d="M96 124c44-52 128-76 200-54 52 14 102 44 126 84L188 368c-54-20-96-74-92-244z" fill="url(#glassShine)"/>
    <path d="M128 156c20-10 44-12 64-5" stroke="#ffffff" stroke-opacity="0.34" stroke-width="6" stroke-linecap="round"/>
    <path d="M158 196c26-12 54-14 80-7" stroke="#ffffff" stroke-opacity="0.16" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Sun / orb -->
  <circle cx="358" cy="156" r="62" fill="url(#orbGlow)"/>
  <circle cx="358" cy="156" r="36" fill="url(#orb)" filter="url(#orbBloom)"/>
  <circle cx="344" cy="142" r="11" fill="#fffdf2" opacity="0.9"/>
  <circle cx="368" cy="168" r="7" fill="#7a5c10" opacity="0.32"/>
  <!-- Lens flare rays -->
  <g stroke="#fff7c8" stroke-opacity="0.55" stroke-linecap="round">
    <path d="M358 118v14" stroke-width="3"/>
    <path d="M390 140l10-10" stroke-width="2.5"/>
    <path d="M398 156h12" stroke-width="2.5"/>
  </g>

  <!-- Dimensional metallic R -->
  <g filter="url(#rShadow)">
    <path
      d="M162 356V152h84c46 0 76 24 76 60 0 26-14 46-38 54l50 90h-56l-48-80h-26v80h-42zm46-122h26c20 0 34-11 34-28s-14-28-34-28h-26v56z"
      fill="url(#metalR)"
    />
    <!-- Left edge highlight for extruded feel -->
    <path
      d="M162 152h10v204h-10z"
      fill="url(#metalRSide)"
    />
    <!-- Top highlight -->
    <path
      d="M172 152h68c20 0 36 6 48 18-8-18-28-30-56-30h-60v12z"
      fill="#fff8d0"
      opacity="0.35"
    />
    <!-- Bowl highlight -->
    <path
      d="M208 182h24c12 0 20 6 20 15s-8 15-20 15h-24v-30z"
      fill="#fff6c8"
      opacity="0.28"
    />
  </g>
</svg>
